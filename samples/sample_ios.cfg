version 17.9
service timestamps debug datetime msec
service password-encryption
hostname C9500-CORE
!
boot system flash:cat9k_iosxe.17.09.04a.SPA.bin
!
vrf definition TENANT-A
 rd 65001:100
 address-family ipv4
  route-target export 65001:100
  route-target import 65001:100
 exit-address-family
!
vlan 10
 name USERS
!
interface TenGigabitEthernet1/0/1
 description UPLINK
 switchport mode trunk
 switchport trunk allowed vlan 10,20
 channel-group 1 mode active
!
interface Vlan10
 vrf forwarding TENANT-A
 ip address 10.0.10.1 255.255.255.0
 standby 10 ip 10.0.10.254
 standby 10 priority 110
 standby 10 preempt
!
interface GigabitEthernet1/0/48
 no switchport
 ip address 172.16.1.1 255.255.255.252
 ip ospf 1 area 0
!
router ospf 1
 router-id 1.1.1.1
!
router bgp 65001
 bgp router-id 1.1.1.1
 neighbor 172.16.1.2 remote-as 65002
 address-family ipv4
  network 10.0.10.0 mask 255.255.255.0
 exit-address-family
!
ip route 0.0.0.0 0.0.0.0 172.16.1.2
ip route vrf TENANT-A 10.99.0.0 255.255.0.0 10.0.10.254
!
ip access-list extended PROTECT
 10 permit tcp 10.0.0.0 0.255.255.255 any eq 443
 20 deny ip any any
!
no ip domain lookup
end
